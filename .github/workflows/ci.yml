name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  runtime-smoke:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Ensure Metal tools are available
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Install Zig 0.15
        run: brew install zig@0.15

      - name: Build vendored Ghostty runtime
        run: make setup

      - name: Verify project with runtime enabled
        run: make verify

      - name: Launch app smoke test
        run: make smoke
